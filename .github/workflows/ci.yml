name: CI

on: [push, pull_request]

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code/auction
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/auction/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test
          npm run build
